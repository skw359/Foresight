name: ForesightCameraClient
options:
  bundleIdPrefix: com.foresight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.15.0
  # libsodium (X25519 crypto_box_seal + Argon2id) for E2EE key management.
  # Mandatory: CryptoKit cannot open a libsodium sealed box (no crypto_box).
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.9.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The camera client must build for arm64 devices and the simulator.
    # The Simulator cannot exercise the camera, but the target must compile there.
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ForesightCameraClient:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Foresight Camera
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Portrait + landscape so the camera can be wall/shelf mounted either way.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        # Usage strings (required by the task).
        NSCameraUsageDescription: >-
          Foresight uses the camera to stream live video so you can watch this
          space remotely.
        NSMicrophoneUsageDescription: >-
          Foresight uses the microphone to stream live audio alongside the video.
        NSLocalNetworkUsageDescription: >-
          Foresight connects to your Foresight server and media relay on your
          local network to pair and stream.
        # Background audio keeps the PTT / streaming pipeline alive when screen
        # dims; the device is meant to stay plugged in and awake while streaming.
        UIBackgroundModes:
          - audio
        # Bonjour services are declared so local-network discovery is permitted.
        NSBonjourServices:
          - _foresight._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foresight.cameraclient
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Signing is left to "Automatic" with no team so xcodebuild can compile
        # for the generic iOS / Simulator destinations without a provisioning
        # profile. Set your team in Xcode before running on a device.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: Sodium
        product: Sodium

  # Unit-test bundle. Hosts the M0 E2EE cross-platform parity test
  # (Tests/E2EEParityTests.swift) so swift-sodium's Argon2id / secretbox /
  # sealed-box behavior can be asserted against shared/test-vectors/e2ee-parity.json.
  ForesightCameraClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      # Host on the app so `@testable import ForesightCameraClient` can reach
      # the ForesightE2EE constants; Sodium is linked directly for the crypto.
      - target: ForesightCameraClient
      - package: Sodium
        product: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foresight.cameraclient.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ForesightCameraClient:
    build:
      targets:
        ForesightCameraClient: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ForesightCameraClientTests
    archive:
      config: Release
