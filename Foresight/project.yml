name: Foresight
options:
  bundleIdPrefix: com.foresight
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.9.0"
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.9.1"

targets:
  Foresight:
    type: application
    platform: iOS
    sources:
      - path: Foresight
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: Sodium
        product: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foresight.viewer
        INFOPLIST_FILE: Foresight/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # Unit tests. The E2EE parity test (E2EEParityTests) is a self-contained
  # swift-sodium logic test — the M0 cross-platform gate — so it needs only the
  # Sodium package, no app host. Runs on a Mac (`xcodebuild test`); Swift cannot
  # compile on the Windows host.
  ForesightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ForesightTests
    dependencies:
      - package: Sodium
        product: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foresight.viewer.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Foresight:
    build:
      targets:
        Foresight: all
        ForesightTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ForesightTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
