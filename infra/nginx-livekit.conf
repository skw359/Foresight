# ============================================================================
# Foresight — LiveKit signaling reverse proxy   (livekit.example.com)
# ----------------------------------------------------------------------------
# Terminates TLS on this proxy host and forwards ONLY the LiveKit *signaling*
# WebSocket (/rtc…) to the LiveKit server on the LAN. LiveKit's HTTP/Twirp
# server API (/twirp/livekit.RoomService/… — list rooms, kick participants,
# send data, mint nothing but trust the API key) is deliberately NOT exposed:
# only foresight-server needs it, and it talks to LiveKit directly.
#
# IMPORTANT: only SIGNALING goes through here. WebRTC *media* (audio/video)
# flows DIRECTLY between the browser and the LiveKit host over
# UDP 50000-50100 / TCP 7881 and is already DTLS-SRTP encrypted — it does NOT
# (and must not) pass through nginx. So those media ports still have to be
# reachable from the viewer to the LiveKit host. (On the LAN this already works.)
#
# This coexists with your existing foresight.example.com site — nginx routes by
# server_name, so both live on :443.
#
# Install (see infra/TLS-SETUP.md for the cert step first):
#   sudo cp infra/nginx-livekit.conf /etc/nginx/sites-available/livekit.example.com
#   sudo ln -s /etc/nginx/sites-available/livekit.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Set "Connection: upgrade" only on WebSocket requests, "close" otherwise.
# Uniquely named so it can't clash with a map already defined for another site.
# (If nginx errors with "duplicate map", you already have one — delete this block
#  and reuse the existing variable in the proxy_set_header Connection line below.)
map $http_upgrade $lk_connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- Plain HTTP :80 — allow ACME renewals, redirect everything else to HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name livekit.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location /                            { return 301 https://$host$request_uri; }
}

# ---- TLS :443 — terminate TLS and reverse-proxy to LiveKit -----------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name livekit.example.com;

    # Issued by certbot for livekit.example.com (see TLS-SETUP.md).
    ssl_certificate     /etc/letsencrypt/live/livekit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.example.com/privkey.pem;
    # These two are dropped in by certbot on Debian-based systems.
    # If the files don't exist on your box, comment them out.
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # LiveKit signaling WebSocket (/rtc, /rtc/v1, /rtc/validate). Set the
    # target to your LiveKit host's address. If LiveKit runs ON this machine,
    # change it to http://127.0.0.1:7880.
    location /rtc {
        proxy_pass http://192.168.1.20:7880;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $lk_connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # LiveKit sockets are long-lived; don't let nginx time them out.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering    off;
    }

    # Health check (LiveKit answers "OK" on /).
    location = / {
        proxy_pass http://192.168.1.20:7880;
    }

    # Everything else — notably /twirp/ (LiveKit's server API) — stays private.
    location / {
        return 404;
    }
}
